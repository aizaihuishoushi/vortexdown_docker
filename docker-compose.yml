services:
  vortexdown:
    # 方式一：从 Docker Hub 拉取镜像（飞牛可直接搜索或输入镜像名）
    image: zaizaiyang/vortexdown:latest
    #
    # 方式二：从 GHCR 拉取（备用）
    # image: ghcr.io/aizaihuishoushi/vortexdown_docker:latest
    #
    # 方式三：本地构建（取消下面 build 注释，注释掉上面的 image）
    # build: .
    container_name: vortexdown
    restart: unless-stopped
    ports:
      - "19634:19634"
    volumes:
      # 下载目录 - 映射到 fnOS 的存储空间
      - /vol1/1000/vortexdown/downloads:/downloads
      # 数据持久化（任务记录、设置）
      - /vol1/1000/vortexdown/data:/app/data
      # 映射宿主机其他目录（可选，用于浏览文件选择保存路径）
      - /vol1/1000:/host:ro
    environment:
      - TZ=Asia/Shanghai
      - PORT=19634
      - DOWNLOAD_DIR=/downloads
      - VORTEXDOWN_ROOT=/app
      - DATA_DIR=/app/data
      # 浏览文件时的根路径限制（可选，留空则允许浏览 / ）
      - BROWSE_ROOTS=/downloads,/host
    # fnOS 上建议不限制 user，让容器以 root 运行，
    # 这样能正常写入挂载的 /vol1/1000 目录
    privileged: false